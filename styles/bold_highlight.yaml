mode: highlight
font: Noto Sans
font_bold: Noto Sans Bold
font_size: 66
bold: true

# Whole phrase stays visible; a box tracks the word currently being spoken
# (see subtitles.py:_highlight_tags), so box_color is the neutral state and
# keyword_box_color is what the active word flashes to.
primary_color: [255, 255, 255]
outline_color: [0, 0, 0]
box_color: [20, 20, 20]
box_alpha: 110
keyword_box_color: [254, 44, 85]
box_pad: 12
shadow: 0
margin_v: 240
margin_h: 60

max_words_per_line: 4
max_chars_per_line: 24

hook_color: [254, 44, 85]
hook_outline_width: 5
hook_margin_v: 200
